<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>v_box</title>
  <link rel="icon" type="image/png" href="assets/ghost.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <div class="logo">
      <img src="assets/ghost.png" alt="ghost" class="ghost-mascot">
      <span class="logo-title">v_box</span>
    </div>
    <div class="header-links">
      <a href="https://github.com/Vure-sh/vure_box" target="_blank" class="gh-link" title="github repository"><span
          class="gh-halloween"><i class="fa-solid fa-hat-wizard hat"></i><i class="fa-brands fa-github"></i></span></a>
    </div>
  </header>

  <nav id="tabs">
    <div class="tab-group">
      <button class="active" data-target="scratch">notes</button>
      <button data-target="json">json</button>
      <button data-target="b64">base64</button>
      <button data-target="req">fetch</button>
    </div>
    <img src="assets/pumpkin.png" alt="pumpkin" class="pumpkin-deco">
  </nav>

  <main>
    <section id="scratch" class="panel active">
      <textarea id="pad" placeholder="write note"></textarea>
      <!--idk why i added char count tbh-->
      <div class="status-bar">char: <span id="char-count">0</span></div>
    </section>

    <section id="json" class="panel">
      <div class="toolbar">
        <button id="btn-fmt">format</button>
        <button id="btn-min">minify</button>
        <span id="json-status" class="msg"></span>
      </div>
      <textarea id="json-box" placeholder="paste json"></textarea>
    </section>

    <section id="b64" class="panel">
      <div class="toolbar">
        <button id="btn-enc">encode</button>
        <button id="btn-dec">decode</button>
        <span id="b64-status" class="msg"></span>
      </div>
      <textarea id="b64-in" placeholder="base64 string"></textarea>
      <textarea id="b64-out" placeholder="result"></textarea>
    </section>

    <section id="req" class="panel">
      <div class="toolbar">
        <select id="api-method">
          <option>GET</option>
          <option>POST</option>
          <option>PUT</option>
          <option>DELETE</option>
        </select>
        <input id="api-url" value="https://httpbin.org/get" placeholder="https://api...">
        <!--default link (useful for testing)-->
        <button id="btn-send">fetch</button>
        <button id="btn-to-json">to json</button>
        <span id="api-status" class="msg"></span>
      </div>
      <textarea id="api-headers" placeholder="headers (one per line, e.g. Authorization: Bearer ...)"></textarea>
      <textarea id="api-body" placeholder="request body (for POST/PUT)"></textarea>
      <textarea id="api-out" placeholder="response body"></textarea>
    </section>
  </main>

  <script src="script.js"></script>
</body>

</html>
